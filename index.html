<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live IPTV</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://cdn.jwplayer.com">

<meta name="theme-color" content="#111827">
<meta name="description" content="Premium IPTV Platform">

</head>
<body>

<!-- Loader -->
<div id="loader">
    <div class="spinner"></div>
</div>

<!-- Sidebar Desktop -->
<aside class="sidebar">
    <div class="logo">
        <h2>LIVE IPTV</h2>
    </div>

    <nav>
        <button class="nav-btn active" data-category="all">All</button>
        <button class="nav-btn" data-category="sports">Sports</button>
        <button class="nav-btn" data-category="news">News</button>
        <button class="nav-btn" data-category="movies">Movies</button>
        <button class="nav-btn" data-category="kids">Kids</button>
        <button class="nav-btn" data-category="music">Music</button>
    </nav>
</aside>

<!-- Main -->
<main class="main-content">

    <!-- Header -->
    <header class="topbar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search channels...">
        </div>

        <div class="clock" id="clock">
            00:00
        </div>
    </header>

    <!-- Banner -->
    <section class="hero-banner">
        <div class="banner-slide active">
            <img src="assets/banner1.jpg" alt="">
        </div>
    </section>

    <!-- Player -->
    <section class="player-section">
        <div id="player"></div>

        <div class="channel-info">
            <img id="channelLogo" src="" alt="">
            <div>
                <h3 id="channelName">Select Channel</h3>
                <p id="channelCategory">Category</p>
            </div>
        </div>
    </section>

    <!-- Channels -->
    <section class="channels">

        <div class="section-title">
            <h2>Live Channels</h2>
        </div>

        <div id="channelGrid" class="channel-grid">
            <!-- Dynamic -->
        </div>

    </section>

</main>

<!-- Mobile Bottom Navigation -->
<div class="mobile-nav">

    <button data-category="all">
        Home
    </button>

    <button data-category="sports">
        Sports
    </button>

    <button data-category="movies">
        Movies
    </button>

    <button data-category="favorites">
        Favorites
    </button>

</div>

<!-- JW Player -->
<script src="https://cdn.jwplayer.com/libraries/YOUR_LIBRARY_ID.js"></script>

<!-- Scripts -->
<script src="js/player.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>

</body>
</html>
